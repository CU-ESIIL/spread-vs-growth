site_name: "spread-vs-growth"
site_description: "Figures and animations comparing wildfire spread rate and growth rate"
site_url: "https://cu-esiil.github.io/spread-vs-growth/"

repo_name: "CU-ESIIL/spread-vs-growth"
repo_url: "https://github.com/CU-ESIIL/spread-vs-growth"
edit_uri: "edit/main/docs/"

nav:
  - Site:
      - Home: index.md
      - Storyboard: storyboard.md
      - Workflow: workflow.md
      - Fire Model Scaling: fire-model-scaling.md
      - FIRED Prediction Test: fired-prediction.md
      - FIRED Outcome Validation: fired-outcome-validation.md
      - FIRED Life-Cycle Prediction: fired-lifecycle-prediction.md
      - FIRED State-Survival Prediction: fired-state-survival.md
      - FIRED Persistence And Damage: fired-persistence-damage.md
      - FIRED Potential-To-Realization Gap: fired-realization-gap.md
      - FIRED Missing-Process Tests: fired-missing-processes.md
      - Detection And Prediction Audit: DETECTION_PREDICTION_AUDIT.md
      - Detection Validation: DETECTION_VALIDATION.md
      - Prediction Validation: PREDICTION_VALIDATION.md
      - Mechanism Discrimination: MECHANISM_DISCRIMINATION.md
      - Effective Coupling Audit: EFFECTIVE_COUPLING_AUDIT.md
      - Effective Coupling Validation: EFFECTIVE_COUPLING_VALIDATION.md
      - Geometric Attractor Audit: GEOMETRIC_ATTRACTOR_AUDIT.md
      - Geometric Attractor Validation: GEOMETRIC_ATTRACTOR_VALIDATION.md
      - Within-Between Geometric Scaling: GEOMETRIC_MANIFOLD_VALIDATION.md
      - Geometric Scaling Manuscript Handoff: GEOMETRIC_MANIFOLD_MANUSCRIPT_HANDOFF.md
      - One-Half Normalization Re-audit: HALF_POWER_REAUDIT.md
      - One-Half Manuscript Handoff: HALF_POWER_REAUDIT_MANUSCRIPT_HANDOFF.md
      - Final State, Scale, Detection, and Prediction Audit: FINAL_STATE_SCALE_PREDICTION_AUDIT.md
      - Final Manuscript Handoff: FINAL_STATE_SCALE_PREDICTION_MANUSCRIPT_HANDOFF.md
      - Geometric Scale Audit: GEOMETRIC_SCALE_AUDIT.md
      - Optimal Transport Validation: OPTIMAL_TRANSPORT_VALIDATION.md
      - Integrated Geometry And Transport: INTEGRATED_GEOMETRY_TRANSPORT_VALIDATION.md
      - Latent Constraint Validation: LATENT_CONSTRAINT_VALIDATION.md
      - FIRED Detectability Matrix: FIRED_DETECTABILITY_MATRIX.md
      - Half Versus Two-Thirds Constraint Test: HALF_VS_TWO_THIRDS_CONSTRAINT_TEST.md
      - SI Empirical Handoff: SI_EMPIRICAL_HANDOFF.md
      - Fire Metabolism Mathematics: fire-metabolism-math.md
      - Manuscript Figure Remakes: manuscript-figures.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search
