[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spread-vs-growth"
version = "0.1.0"
description = "Reproducible analyses of wildfire spread, growth, geometry, and conditional energetic scaling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "reportlab>=4.2",
  "pypdf>=6.0",
  "scikit-image>=0.24",
  "scipy>=1.14",
  "sympy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
